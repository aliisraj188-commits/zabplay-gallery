name: Build ZabPlay APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f bun.lockb package-lock.json
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Ensure dist/ contains a Capacitor-ready index.html
        run: |
          mkdir -p dist

          # Flatten any nested client build into dist/
          if [ -d "dist/client" ]; then
            echo "📁 Flattening dist/client -> dist/"
            cp -a dist/client/. dist/
          fi
          if [ ! -f "dist/index.html" ] && [ -f ".output/public/index.html" ]; then
            echo "📁 Copying .output/public -> dist/"
            cp -a .output/public/. dist/
          fi
          if [ ! -f "dist/index.html" ] && [ -f ".vinxi/build/client/index.html" ]; then
            echo "📁 Copying .vinxi/build/client -> dist/"
            cp -a .vinxi/build/client/. dist/
          fi

          # If still no index.html, synthesize one that boots the React app
          if [ ! -f "dist/index.html" ]; then
            echo "⚙️ Generating dist/index.html from built JS/CSS assets"
            node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs'
          import { join, relative } from 'node:path'

          const distDir = 'dist'
          if (!existsSync(distDir)) { console.error('❌ dist missing'); process.exit(1) }

          const walk = (d) => readdirSync(d).flatMap((n) => {
            const p = join(d, n)
            return statSync(p).isDirectory() ? walk(p) : [p]
          })
          const toHref = (f) => './' + relative(distDir, f).replaceAll('\\','/')

          const files = walk(distDir)
          const jsFiles = files.filter((f) => f.endsWith('.js'))
          const entry = jsFiles.find((f) => {
            const c = readFileSync(f, 'utf8')
            return c.includes('hydrateRoot(document') || c.includes('createRoot(document')
          }) ?? jsFiles.find((f) => readFileSync(f, 'utf8').includes('@tanstack/react-start')) ?? jsFiles[0]
          if (!entry) { console.error('❌ no JS entry'); process.exit(1) }

          const cssLinks = files.filter((f) => f.endsWith('.css'))
            .map((f) => `    <link rel="stylesheet" href="${toHref(f)}">`).join('\n')

          writeFileSync('dist/index.html', `<!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
              <title>ZabPlay</title>
          ${cssLinks}
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="${toHref(entry)}"></script>
            </body>
          </html>
          `)
          console.log('✅ Created dist/index.html with entry ' + toHref(entry))
          NODE
          fi

          # Make all asset paths relative for the Capacitor WebView
          sed -i 's|href="/|href="./|g' dist/index.html
          sed -i 's|src="/|src="./|g' dist/index.html

          # Guarantee <div id="root"></div> exists
          if ! grep -q '<div id="root"' dist/index.html; then
            sed -i 's|<body>|<body><div id="root"></div>|' dist/index.html
          fi

          echo "----- dist/index.html (first 60 lines) -----"
          head -60 dist/index.html
          echo "--------------------------------------------"

          test -f dist/index.html
          grep -q '<script' dist/index.html
          grep -q '<div id="root"' dist/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Capacitor Sync Android
        run: |
          npx cap add android 2>/dev/null || echo "Android platform already exists"
          npx cap sync android

      - name: Build APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build AAB (bundleDebug)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZabPlay-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZabPlay-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab

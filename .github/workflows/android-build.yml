name: Build ZabPlay APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Verify Capacitor web bundle
        run: |
          if [ ! -f dist/client/index.html ] && [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          fi
          test -f dist/client/index.html
          sed -i 's|href="/|href="./|g' dist/client/index.html
          sed -i 's|src="/|src="./|g' dist/client/index.html

          echo "----- dist/client/index.html (first 80 lines) -----"
          head -80 dist/client/index.html
          echo "--------------------------------------------"

          grep -q '<script' dist/client/index.html
          grep -q '<link rel="stylesheet"\|\.css' dist/client/index.html
          grep -q '_build/' dist/client/index.html
          grep -q "webDir: 'dist/client'" capacitor.config.ts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Capacitor Sync Android
        run: |
          npx cap add android 2>/dev/null || echo "Android platform already exists"
          npx cap sync android

      - name: Build APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build AAB (bundleDebug)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZabPlay-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZabPlay-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
